<!doctype html>

<head>

<body>
<div class="slide">
  <div class="top">
    <span>Mehr Patni · Content marketing notes</span>
    <span class="num">04 / 05</span>

  <div class="head">
    <h1 class="title">When <em>everyone</em> has AI.</h1>
    <p class="sub">The edge moves to what AI can't carry. Use the machine for production, hold the taste yourself.</p>
  </div>

  <div class="diagram">
    <svg viewBox="0 0 1000 540" aria-hidden="true">
      <!-- Left circle: AI -->
      <circle cx="380" cy="270" r="200" fill="#A6802E" fill-opacity=".15" stroke="#80621F" stroke-width="1.4"/>
      <!-- Right circle: Humans -->
      <circle cx="620" cy="270" r="200" fill="#2A1810" fill-opacity=".10" stroke="#2A1810" stroke-width="1.4"/>

      <!-- AI label (top of left circle) -->
      <text class="title-sm" x="260" y="160" text-anchor="middle" font-size="34" fill="#80621F">AI</text>
      <text class="sc" x="260" y="190" text-anchor="middle" font-size="14" letter-spacing=".3em" fill="#80621F" opacity=".7">DOES</text>

      <!-- AI bullets (left half, outside overlap) -->
      <text class="ital" x="230" y="245" text-anchor="middle" font-size="20" fill="#5A4438">production</text>
      <text class="ital" x="230" y="280" text-anchor="middle" font-size="20" fill="#5A4438">variation</text>
      <text class="ital" x="230" y="315" text-anchor="middle" font-size="20" fill="#5A4438">distribution</text>
      <text class="ital" x="230" y="350" text-anchor="middle" font-size="20" fill="#5A4438">summary</text>

      <!-- Humans label -->
      <text class="title-sm" x="740" y="160" text-anchor="middle" font-size="34" fill="#2A1810">Humans</text>
      <text class="sc" x="740" y="190" text-anchor="middle" font-size="14" letter-spacing=".3em" fill="#2A1810" opacity=".7">DO</text>

      <!-- Human bullets (right half, outside overlap) -->
      <text class="ital" x="770" y="245" text-anchor="middle" font-size="20" fill="#5A4438">taste</text>
      <text class="ital" x="770" y="280" text-anchor="middle" font-size="20" fill="#5A4438">conviction</text>
      <text class="ital" x="770" y="315" text-anchor="middle" font-size="20" fill="#5A4438">lived context</text>
      <text class="ital" x="770" y="350" text-anchor="middle" font-size="20" fill="#5A4438">judgement</text>

      <!-- Overlap label (center) -->
      <text class="title-sm" x="500" y="245" text-anchor="middle" font-size="32" fill="#80621F">AI-adept</text>
      <text class="ital" x="500" y="280" text-anchor="middle" font-size="18" fill="#80621F">humans direct,</text>
      <text class="ital" x="500" y="305" text-anchor="middle" font-size="18" fill="#80621F">AI executes</text>

      <!-- Below diagram -->
      <text class="sc" x="500" y="500" text-anchor="middle" font-size="16" letter-spacing=".34em" fill="#8B7C6A">↑ THE OVERLAP IS WHERE THE WORK LIVES</text>
    </svg>
  </div>

  <div class="foot">
    <span class="mark">Mehr Patni</span>
    <span class="caption">When everyone has the same machine — the taste behind it is the brand.</span>
  </div>

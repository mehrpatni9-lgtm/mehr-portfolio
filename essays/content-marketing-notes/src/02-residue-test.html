<body>
<div class="slide">
  <div class="top">
    <span>Mehr Patni · Content marketing notes</span>
    <span class="num">02 / 05</span>
  </div>

  <div class="head">
    <h1 class="title">The <em>residue</em> test.</h1>
    <p class="sub">One question before you ship, in six months, what residue does this leave?</p>
  </div>

  <div class="diagram">
    <svg viewBox="0 0 1000 540" aria-hidden="true">
      <!-- axis frame -->
      <line x1="120" y1="60" x2="120" y2="480" stroke="#8B7C6A" stroke-width="1.4" opacity=".5"/>
      <line x1="120" y1="480" x2="880" y2="480" stroke="#8B7C6A" stroke-width="1.4" opacity=".5"/>
      <line x1="120" y1="270" x2="880" y2="270" stroke="#8B7C6A" stroke-width="1" opacity=".3" stroke-dasharray="6 6"/>
      <line x1="500" y1="60" x2="500" y2="480" stroke="#8B7C6A" stroke-width="1" opacity=".3" stroke-dasharray="6 6"/>

      <!-- honey highlight ring on top-right quadrant -->
      <rect x="500" y="60" width="380" height="210" fill="#A6802E" opacity=".08"/>

      <!-- top-right: Compounding -->
      <text class="title-sm" x="690" y="155" text-anchor="middle" font-size="42" fill="#80621F">Compounding</text>
      <text class="ital" x="690" y="190" text-anchor="middle" font-size="20" fill="#5A4438">remembered + moved</text>
      <text class="ital" x="690" y="220" text-anchor="middle" font-size="16" fill="#8B7C6A">the gold standard</text>

      <!-- top-left: Viral fluff -->
      <text class="title-sm" x="310" y="155" text-anchor="middle" font-size="34" fill="#2A1810">Viral fluff</text>
      <text class="ital" x="310" y="190" text-anchor="middle" font-size="18" fill="#5A4438">remembered, not moved</text>
      <text class="ital" x="310" y="216" text-anchor="middle" font-size="15" fill="#8B7C6A">vanity, no lift</text>

      <!-- bottom-right: Direct response -->
      <text class="title-sm" x="690" y="350" text-anchor="middle" font-size="34" fill="#2A1810">Direct response</text>
      <text class="ital" x="690" y="385" text-anchor="middle" font-size="18" fill="#5A4438">moved, then forgotten</text>
      <text class="ital" x="690" y="411" text-anchor="middle" font-size="15" fill="#8B7C6A">no compounding moat</text>

      <!-- bottom-left: Forgettable -->
      <text class="title-sm" x="310" y="350" text-anchor="middle" font-size="34" fill="#8B7C6A">Forgettable</text>
      <text class="ital" x="310" y="385" text-anchor="middle" font-size="18" fill="#8B7C6A">neither + neither</text>
      <text class="ital" x="310" y="411" text-anchor="middle" font-size="15" fill="#8B7C6A">most ad creative</text>

      <!-- axis labels -->
      <text class="sc" x="895" y="485" text-anchor="end" font-size="16" letter-spacing=".34em" fill="#8B7C6A">MEMORABLE →</text>
      <text class="sc" x="116" y="55" text-anchor="end" font-size="16" letter-spacing=".34em" fill="#8B7C6A">↑ MOVED</text>
    </svg>
  </div>

  <div class="foot">
    <span class="mark">Mehr Patni</span>
    <span class="caption">If the answer is "forgettable", kill it before it's published.</span>
  </div>

  <div class="head">
    <h1 class="title">The attention <em>stack.</em></h1>
    <p class="sub">Voice first. Story next. Tactics last. Most teams invert this, and wonder why the work doesn't compound.</p>
  </div>

  <div class="diagram">
    <svg viewBox="0 0 1000 500" aria-hidden="true">
      <!-- VOICE, 60%, honey solid -->
      <rect x="80" y="60" width="552" height="100" fill="#A6802E"/>
      <text class="title-sm" x="100" y="125" font-size="42" fill="#F2EDE3">VOICE</text>
      <text class="ital" x="100" y="155" font-size="17" fill="#F2EDE3" opacity=".85">how you sound, year after year, the only durable layer</text>
      <text class="sc" x="710" y="125" font-size="22" letter-spacing=".3em" fill="#8B7C6A">60%</text>

      <!-- STORY, 30%, honey opaque -->
      <rect x="80" y="190" width="276" height="100" fill="#A6802E" opacity=".42"/>
      <text class="title-sm" x="100" y="255" font-size="34" fill="#2A1810">STORY</text>
      <text class="ital" x="100" y="282" font-size="15" fill="#5A4438">the narrative the work travels in, replaces every 1–2 yrs</text>
      <text class="sc" x="450" y="255" font-size="22" letter-spacing=".3em" fill="#8B7C6A">30%</text>

      <!-- TACTICS, 10%, ink soft -->
      <rect x="80" y="320" width="92" height="100" fill="#8B7C6A" opacity=".4"/>
      <text class="title-sm" x="100" y="385" font-size="28" fill="#2A1810">TACTICS</text>
      <text class="ital" x="280" y="385" font-size="15" fill="#5A4438">the formats and channels, replaceable every quarter</text>
      <text class="sc" x="220" y="385" font-size="22" letter-spacing=".3em" fill="#8B7C6A">10%</text>
    </svg>
  </div>

  <div class="foot">
    <span class="mark">Mehr Patni</span>
    <span class="caption">Voice eats first. Tactics are the garnish.</span>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>01 · Marketing that ages well</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./slide.css">
</head>
<body>
<div class="slide">
  <div class="top">
    <span>Mehr Patni · Content marketing notes</span>
    <span class="num">01 / 05</span>
  </div>

  <div class="head">
    <h1 class="title">Marketing that <em>ages well.</em></h1>
    <p class="sub">Profit per piece, not views per piece. Two curves, pick the one you're optimising for.</p>
  </div>

  <div class="diagram">
    <svg viewBox="0 0 1000 540" aria-hidden="true">
      <!-- axes -->
      <line x1="100" y1="60" x2="100" y2="460" stroke="#8B7C6A" stroke-width="1.4" opacity=".5"/>
      <line x1="100" y1="460" x2="940" y2="460" stroke="#8B7C6A" stroke-width="1.4" opacity=".5"/>

      <!-- viral bell (dashed) -->
      <path d="M 110 458 C 280 458, 320 100, 420 100 C 520 100, 580 458, 820 458 L 935 460"
            fill="none" stroke="#8B7C6A" stroke-width="3.4" stroke-dasharray="11 9" stroke-linecap="round" opacity=".5"/>

      <!-- compound (solid honey) -->
      <path d="M 110 461 C 440 459, 620 360, 760 240 S 905 110, 935 70"
            fill="none" stroke="#A6802E" stroke-width="5.2" stroke-linecap="round"/>

      <!-- curve labels -->
      <text class="sc" x="420" y="80" text-anchor="middle" font-size="28" letter-spacing=".3em" fill="#8B7C6A" opacity=".75">VIRAL</text>
      <text class="sc" x="935" y="62" text-anchor="end" font-size="34" letter-spacing=".3em" fill="#80621F">COMPOUND</text>

      <!-- axis labels -->
      <text class="sc" x="62" y="260" text-anchor="middle" transform="rotate(-90 62 260)" font-size="22" letter-spacing=".34em" fill="#8B7C6A" opacity=".75">PROFIT</text>
      <text class="sc" x="520" y="510" text-anchor="middle" font-size="22" letter-spacing=".34em" fill="#8B7C6A" opacity=".75">TIME →</text>

      <!-- short notes under each curve -->
      <text class="ital" x="420" y="445" text-anchor="middle" font-size="18" fill="#8B7C6A">peaks. decays. is forgotten.</text>
      <text class="ital" x="820" y="160" text-anchor="middle" font-size="18" fill="#80621F">slow start. never plateaus.</text>
    </svg>
  </div>

  <div class="foot">
    <span class="mark">Mehr Patni</span>
    <span class="caption">Boring beats viral when it compounds.</span>
  </div>
</div>
</body>
</html>
